name: Generate Piper Neural Voice Packs (en-GB & Scottish)

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/story/roivas_chapters.js'
      - '.github/workflows/generate-piper-narration.yml'

permissions:
  contents: write

jobs:
  synthesize-voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Piper TTS & Download Verified Voice Models
        run: |
          pip install --user piper-tts
          mkdir -p /tmp/voices assets/audio
          python3 -m piper.download_voices --download-dir /tmp/voices en_GB-alan-medium en_GB-alba-medium

      - name: Synthesize Chapter Narrations & 12 Rune Incantations
        run: |
          python3 -m piper -m /tmp/voices/en_GB-alan-medium.onnx -f assets/audio/ch1_foyer.wav -- \
            "October twenty twenty-six. Twenty-four years after Alexandra Roivas sealed the estate, the Foyer grandfather clock strikes thirteen."
          python3 -m piper -m /tmp/voices/en_GB-alan-medium.onnx -f assets/audio/ch2_library.wav -- \
            "In the Forbidden Library, a Xel-lotath horror materializes from the Tome of Eternal Darkness, fracturing your perception."
          python3 -m piper -m /tmp/voices/en_GB-alan-medium.onnx -f assets/audio/ch3_observatory.wav -- \
            "Beneath the manor, the three-dimensional crystal splits along coboundary fault lines. Only Mantorok can bind the manifold."

          declare -A RUNES=(
            ["CHATTURGHA"]="Chattur'gha..."
            ["ULYAOTH"]="Ulyaoth..."
            ["XELLOTATH"]="Xel'lotath..."
            ["MANTOROK"]="Mantorok..."
            ["ANTORBOK"]="Antorbok..."
            ["BANKOROK"]="Bankorok..."
            ["TIER"]="Tier..."
            ["NAROKATH"]="Narokath..."
            ["REDGORMOR"]="Redgormor..."
            ["MAGORMOR"]="Magormor..."
            ["ARETAK"]="Aretak..."
            ["PARGON"]="Pargon..."
          )
          for key in "${!RUNES[@]}"; do
            python3 -m piper -m /tmp/voices/en_GB-alba-medium.onnx --length-scale 1.25 -f "assets/audio/rune_${key}.wav" -- "${RUNES[$key]}"
          done

      - name: Commit Rendered WAV Assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add assets/audio/*.wav
          git diff --staged --quiet || git commit -m "chore(audio): render Piper en-GB male and Scottish female WAV packs via CI"
          git push
